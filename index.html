<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Grid</title>
<style>
  :root { --bg:#0e0e11; --card:#1a1a20; --fg:#f2f2f5; --muted:#9a9aa6; --accent:#6c8cff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:14px 16px; position:sticky; top:0; background:var(--bg); z-index:5; border-bottom:1px solid #222; font-weight:600; }
  main { max-width:1100px; margin:0 auto; padding:12px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media (min-width:768px){ .grid { grid-template-columns:repeat(3,1fr); gap:14px; } }
  .card { background:var(--card); border-radius:10px; overflow:hidden; cursor:pointer; }
  .thumb { aspect-ratio:16/9; background:#000 center/cover no-repeat; position:relative; }
  .dur { position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.75); font-size:12px; padding:2px 6px; border-radius:4px; }
  .info { padding:8px 10px 10px; }
  .title { font-size:13px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .meta { font-size:12px; color:var(--muted); margin-top:4px; }
  .pager { display:flex; justify-content:center; align-items:center; gap:6px; flex-wrap:wrap; padding:20px 0 32px; }
  .pager button { background:var(--card); color:var(--fg); border:0; border-radius:8px; min-width:38px; height:38px; padding:0 10px; cursor:pointer; }
  .pager button.active { background:var(--accent); }
  .pager button:disabled { opacity:.35; cursor:default; }
  .status { text-align:center; color:var(--muted); padding:40px 0; }

  /* popup */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; z-index:20; touch-action:none; overflow:hidden; }
  #modal.open { display:block; }
  .slide { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:transform .3s ease; }
  .slide video { max-width:100%; max-height:100%; width:auto; height:100%; background:#000; }
  .caption { position:absolute; left:0; right:0; bottom:0; padding:40px 16px calc(16px + env(safe-area-inset-bottom,0px)); background:linear-gradient(transparent,rgba(0,0,0,.8)); font-size:14px; pointer-events:none; }
  #close { position:absolute; top:calc(10px + env(safe-area-inset-top,0px)); right:12px; z-index:30; width:40px; height:40px; border-radius:50%; border:0; background:rgba(0,0,0,.6); color:#fff; font-size:22px; cursor:pointer; }
  #hint { position:absolute; top:calc(18px + env(safe-area-inset-top,0px)); left:0; right:0; text-align:center; font-size:12px; color:var(--muted); pointer-events:none; z-index:25; }
</style>
</head>
<body>
<header>Videos</header>
<main>
  <div id="grid" class="grid"></div>
  <div id="status" class="status">Loading…</div>
  <nav id="pager" class="pager"></nav>
</main>

<div id="modal">
  <button id="close" aria-label="Close">×</button>
  <div id="hint">Swipe up / down for next / previous</div>
  <div id="stage"></div>
</div>

<script>
/* ---------- CONFIG ---------- */
const DATA_FILE = "videos.json"; // same folder as index.html (array of video objects)
const LIMIT = 32;                // videos per page

/* ---------- STATE ---------- */
let all = [], page = 1, totalPages = 1, videos = [], current = -1, busy = false;
const $ = id => document.getElementById(id);

/* ---------- LOAD + GRID ---------- */
async function init() {
  try {
    const res = await fetch(DATA_FILE);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    all = Array.isArray(json) ? json : (json.videos || json.data || []);
    totalPages = Math.max(1, Math.ceil(all.length / LIMIT));
    load(1);
  } catch (e) {
    console.error(e);
    $("status").textContent = "Cannot load " + DATA_FILE + ": " + e.message +
      " (serve this folder with a local web server, e.g. `npx serve` or `python -m http.server`)";
  }
}

function load(p) {
  page = Math.min(Math.max(1, p), totalPages);
  videos = all.slice((page - 1) * LIMIT, page * LIMIT);
  render();
  window.scrollTo({ top: 0 });
}

function render() {
  $("status").style.display = "none";
  $("grid").innerHTML = videos.map((v, i) => `
    <div class="card" data-i="${i}">
      <div class="thumb" style="background-image:url('${(v.thumbnailSizes?.md?.url || v.thumbnailUrl)}')">
        <span class="dur">${v.duration || ""}</span>
      </div>
      <div class="info">
        <div class="title">${esc(v.title)}</div>
        <div class="meta">${(v.views || 0).toLocaleString()} views</div>
      </div>
    </div>`).join("");
  renderPager();
}

function renderPager() {
  const btn = (label, p, dis, active) =>
    `<button ${dis ? "disabled" : ""} class="${active ? "active" : ""}" data-p="${p}">${label}</button>`;
  let h = btn("‹", page - 1, page <= 1);
  const start = Math.max(1, Math.min(page - 2, totalPages - 4));
  const end = Math.min(totalPages, start + 4);
  if (start > 1) h += btn(1, 1) + (start > 2 ? "<span>…</span>" : "");
  for (let i = start; i <= end; i++) h += btn(i, i, false, i === page);
  if (end < totalPages) h += (end < totalPages - 1 ? "<span>…</span>" : "") + btn(totalPages, totalPages);
  h += btn("›", page + 1, page >= totalPages);
  $("pager").innerHTML = h;
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

$("grid").addEventListener("click", e => {
  const c = e.target.closest(".card"); if (c) openModal(+c.dataset.i);
});
$("pager").addEventListener("click", e => {
  const b = e.target.closest("button"); if (b && !b.disabled) load(+b.dataset.p);
});

/* ---------- POPUP PLAYER ---------- */
function makeSlide(v, offset) {
  const s = document.createElement("div");
  s.className = "slide";
  s.style.transform = `translateY(${offset}%)`;
  s.innerHTML = `<video src="${v.videoUrl}" poster="${v.thumbnailUrl}" playsinline loop controls preload="auto"></video>
                 <div class="caption">${esc(v.title)}</div>`;
  return s;
}

function openModal(i) {
  current = i;
  $("stage").innerHTML = "";
  const s = makeSlide(videos[i], 0);
  $("stage").appendChild(s);
  $("modal").classList.add("open");
  document.body.style.overflow = "hidden";
  s.querySelector("video").play().catch(() => {});
  setTimeout(() => $("hint").style.display = "none", 2500);
}

function closeModal() {
  $("modal").classList.remove("open");
  $("stage").innerHTML = "";
  document.body.style.overflow = "";
  current = -1;
}

// dir = +1 -> next (swipe up), -1 -> previous (swipe down)
function go(dir) {
  if (busy || current < 0) return;
  const n = current + dir;
  if (n < 0 || n >= videos.length) return;
  busy = true;
  const old = $("stage").querySelector(".slide");
  const next = makeSlide(videos[n], dir * 100);
  $("stage").appendChild(next);
  next.getBoundingClientRect(); // force reflow
  old.style.transform = `translateY(${-dir * 100}%)`;
  next.style.transform = "translateY(0)";
  old.querySelector("video").pause();
  next.querySelector("video").play().catch(() => {});
  current = n;
  setTimeout(() => { old.remove(); busy = false; }, 300);
}

$("close").addEventListener("click", closeModal);

// touch swipe
let y0 = null, x0 = null;
$("modal").addEventListener("touchstart", e => { y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; }, { passive: true });
$("modal").addEventListener("touchend", e => {
  if (y0 === null) return;
  const dy = e.changedTouches[0].clientY - y0, dx = e.changedTouches[0].clientX - x0;
  y0 = null;
  if (Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx)) go(dy < 0 ? 1 : -1);
});

// desktop: wheel + keys
let wheelLock = false;
$("modal").addEventListener("wheel", e => {
  if (wheelLock || Math.abs(e.deltaY) < 30) return;
  wheelLock = true; setTimeout(() => wheelLock = false, 500);
  go(e.deltaY > 0 ? 1 : -1);
}, { passive: true });
document.addEventListener("keydown", e => {
  if (current < 0) return;
  if (e.key === "ArrowDown") go(1);
  else if (e.key === "ArrowUp") go(-1);
  else if (e.key === "Escape") closeModal();
});

init();
</script>
</body>
</html>
